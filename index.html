<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="P162zU5QU9m8mPI_h_RU21WUv2vF6ti2cSaR3Jioj8Y">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="gamer-studio-mark.svg?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caacupe+One&family=Changa+One:ital@0;1&family=Fjalla+One&family=Lilita+One&family=Luckiest+Guy&family=Roboto:ital,wght@0,100..900;1,100..900&family=Titan+One&display=swap" rel="stylesheet">
    <title>Gamer Studio</title>
<style>
    html{
        min-height:100%;
        background-color:#000;
    }
    .message-media-attachment{
        display:block;
        width:min(360px, 100%);
        max-height:320px;
        margin:6px 0;
        border-radius:10px;
        object-fit:contain;
        background:#111217;
    }
    .message-attachment-error{
        display:block;
        max-width:min(340px, 100%);
        padding:7px 9px;
        border-radius:8px;
        background:rgba(205,65,81,.13);
        color:#ffb8c0;
        font-size:11px;
        overflow-wrap:anywhere;
    }
    * {
        -webkit-tap-highlight-color: transparent;
    }

    body{
        background-color: black;
    }
    *{
        margin:0px;
        padding:0px;
    }
    #app_bar{
        position:sticky;
        top:0;
        z-index:10;
        box-sizing:border-box;
        background-color:#000;
        border-bottom:1px solid gray;
        height:51px;  
        display:flex;
        flex-direction: row;
        justify-content: space-between;
    }
    #two-icons{
        display:flex;
        align-items:center;
        flex-direction: row;
        padding-right: 20px;
        gap:20px;
    }
    #bells{
        display:block;
        height:30px;
        width:30px;
    }
    #notification-menu{
        position:relative;
        display:grid;
        place-items:center;
    }
    #login-streak{
        display:flex;
        align-items:center;
        gap:4px;
        min-height:32px;
        padding:0 9px;
        border:1px solid #3a3c46;
        border-radius:999px;
        color:#f3f2e9;
        font-size:13px;
        font-weight:700;
        line-height:1;
        white-space:nowrap;
    }
    .friend-request-button{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        flex:none;
        gap:5px;
        min-width:74px;
        min-height:34px;
        padding:0 11px;
        border:1px solid #536bd0;
        border-radius:999px;
        background:#344fb8;
        color:#fff;
        font:inherit;
        font-size:12px;
        font-weight:700;
        cursor:pointer;
        transition:background-color 120ms ease, border-color 120ms ease, transform 120ms ease;
    }
    .friend-request-button:hover:not(:disabled){
        border-color:#8296ff;
        background:#435fc9;
        transform:translateY(-1px);
    }
    .friend-request-button:focus-visible{
        outline:2px solid #9ab8ff;
        outline-offset:2px;
    }
    .friend-request-button svg{
        width:15px;
        height:15px;
    }
    .friend-request-button:disabled{
        opacity:.7;
        cursor:wait;
    }
    .friend-request-button.is-requested{
        border-color:#3b7657;
        background:#1b4932;
        color:#baf2ce;
        cursor:default;
        transform:none;
    }
    #login-streak-emoji{
        font-size:16px;
    }
    .message-action-button{
        display:grid;
        width:36px;
        min-height:36px;
        padding:0;
        place-items:center;
        border-radius:50%;
    }
    .message-action-button svg{
        width:18px;
        height:18px;
    }
    .app-bar-action{
        display:grid;
        place-items:center;
        width:38px;
        height:38px;
        box-sizing:border-box;
        flex:none;
        padding:0;
        border:1px solid #3a3c46;
        border-radius:50%;
        background:transparent;
        color:white;
        cursor:pointer;
    }
    .app-bar-action:hover{
        background:#25262b;
    }
    .app-bar-action[aria-expanded="true"]{
        border-color:#17245f;
        background:#17245f;
        color:#fff;
    }
    .app-bar-action[aria-expanded="true"]:hover{
        border-color:#243982;
        background:#243982;
    }
    .app-bar-action:focus-visible{
        outline:2px solid #9ab8ff;
        outline-offset:2px;
    }
    .app-bar-action svg{
        width:20px;
        height:20px;
    }
    .app-bar-action[hidden]{
        display:none;
    }
    #messages-delete-button{
        color:#ff7180;
    }
    .messages-more-wrap{
        position:relative;
        display:grid;
        width:38px;
        height:38px;
        flex:none;
        place-items:center;
    }
    .messages-more-menu{
        position:absolute;
        top:calc(100% + 8px);
        right:0;
        z-index:60;
        display:flex;
        flex-direction:column;
        width:min(220px, calc(100vw - 32px));
        padding:6px;
        border:1px solid #3a3d49;
        border-radius:20px;
        background:#17191f;
        box-shadow:0 14px 36px rgba(0,0,0,.42);
        color:#f3f2e9;
    }
    .messages-more-menu[hidden]{
        display:none;
    }
    .messages-more-menu button{
        min-height:42px;
        padding:0 12px;
        border:0;
        border-radius:9px;
        background:transparent;
        color:#f3f2e9;
        font:inherit;
        font-size:13px;
        text-align:left;
        cursor:pointer;
    }
    .messages-more-menu button:hover,
    .messages-more-menu button:focus-visible{
        outline:none;
        background:#292c36;
    }
    .messages-more-menu button:disabled{
        opacity:.55;
        cursor:default;
    }
    .messages-menu-status{
        padding:5px 10px;
        color:#a9abb5;
        font-size:11px;
        line-height:1.4;
    }
    .messages-menu-status[hidden]{
        display:none;
    }
    .group-create-overlay{
        position:fixed;
        inset:0;
        z-index:70;
        display:grid;
        place-items:center;
        padding:16px;
        background:rgba(5,6,9,.72);
        backdrop-filter:blur(5px);
    }
    .group-create-panel{
        display:flex;
        flex-direction:column;
        gap:12px;
        width:min(460px, 100%);
        max-height:min(680px, 88dvh);
        padding:20px;
        overflow:hidden;
        border:1px solid #3a3d49;
        border-radius:18px;
        background:#15161c;
        color:#f3f2e9;
        box-shadow:0 18px 50px rgba(0,0,0,.48);
    }
    .group-create-panel h2{
        font-size:19px;
    }
    .group-create-panel > input{
        width:100%;
        min-height:42px;
        box-sizing:border-box;
        padding:8px 12px;
        border:1px solid #3a3c46;
        border-radius:10px;
        background:#1a1b21;
        color:#f3f2e9;
        font:inherit;
    }
    .group-create-members{
        display:flex;
        flex-direction:column;
        min-height:80px;
        overflow-y:auto;
        overscroll-behavior:contain;
    }
    .group-create-member{
        display:flex;
        align-items:center;
        gap:10px;
        min-height:52px;
        border-bottom:1px solid #292b33;
        color:#e5e7ef;
        cursor:pointer;
    }
    .group-create-member input{
        width:17px;
        height:17px;
        accent-color:#5268d2;
    }
    .group-create-member .message-avatar{
        width:34px;
        height:34px;
    }
    .group-create-status{
        min-height:16px;
        color:#a9abb5;
        font-size:12px;
    }
    .group-create-actions{
        display:flex;
        justify-content:flex-end;
        gap:8px;
    }
    .group-create-actions button{
        min-height:38px;
        padding:0 14px;
        border:1px solid #454957;
        border-radius:20px;
        background:#22252d;
        color:#f3f2e9;
        font:inherit;
        cursor:pointer;
    }
    .group-create-actions button[type="submit"]{
        border-color:#5268d2;
        background:#283c9b;
    }
    .group-create-actions button:disabled{
        cursor:wait;
        opacity:.55;
    }
    #notification-bell{
        position:relative;
        display:grid;
        place-items:center;
        width:40px;
        height:40px;
        padding:0;
        border:0;
        border-radius:50%;
        background:transparent;
        color:white;
        cursor:pointer;
    }
    #notification-bell:hover,
    #notification-bell[aria-expanded="true"]{
        background:#25262b;
    }
    #notification-bell:focus-visible,
    .notification-panel button:focus-visible{
        outline:2px solid #9ab8ff;
        outline-offset:2px;
    }
    #notification-count{
        position:absolute;
        top:0;
        right:0;
        display:grid;
        place-items:center;
        min-width:17px;
        height:17px;
        padding:0 3px;
        border:2px solid #080908;
        border-radius:20px;
        background:#e23b50;
        color:white;
        font-size:10px;
        line-height:1;
        box-sizing:border-box;
    }
    #notification-count[hidden]{
        display:none;
    }
    .notification-panel{
        position:absolute;
        top:calc(100% + 8px);
        right:0;
        z-index:30;
        display:flex;
        flex-direction:column;
        width:min(360px, calc(100vw - 24px));
        max-height:min(70vh, 500px);
        overflow:hidden;
        border:1px solid #343640;
        border-radius:20px;
        background:#15161a;
        color:#f3f2e9;
        box-shadow:0 16px 40px rgba(0,0,0,.55);
    }
    .notification-panel[hidden]{
        display:none;
    }
    .incoming-message-banner{
        position:fixed;
        top:calc(env(safe-area-inset-top, 0px) + 12px);
        left:50%;
        z-index:1000;
        display:flex;
        align-items:center;
        gap:12px;
        width:min(420px, calc(100vw - 24px));
        min-height:70px;
        box-sizing:border-box;
        padding:12px 16px;
        border:1px solid #3a3d49;
        border-radius:22px;
        background:rgba(21, 22, 26, .97);
        color:#f3f2e9;
        box-shadow:0 14px 38px rgba(0, 0, 0, .48);
        font:inherit;
        text-align:left;
        cursor:pointer;
        opacity:0;
        pointer-events:none;
        transform:translate(-50%, calc(-100% - 24px));
        transition:transform 240ms cubic-bezier(.2, .8, .2, 1), opacity 180ms ease;
    }
    html[data-theme="light"] .incoming-message-banner{
        border-color:#dce2ed;
        background:rgba(255, 255, 255, .98);
        color:#202638;
        box-shadow:0 14px 38px rgba(25,35,60,.2);
    }
    .incoming-message-banner.is-visible{
        opacity:1;
        pointer-events:auto;
        transform:translate(-50%, 0);
    }
    .incoming-message-banner:focus-visible{
        outline:2px solid #9ab8ff;
        outline-offset:3px;
    }
    .incoming-message-avatar{
        display:grid;
        place-items:center;
        width:46px;
        height:46px;
        flex:none;
        overflow:hidden;
        border:1px solid #536bd0;
        border-radius:50%;
        background:#283c9b;
        color:#fff;
        font-size:18px;
        font-weight:700;
    }
    .incoming-message-avatar img{
        display:block;
        width:100%;
        height:100%;
        object-fit:cover;
        border-radius:inherit;
    }
    .incoming-message-copy{
        display:flex;
        flex:1;
        flex-direction:column;
        min-width:0;
        gap:4px;
    }
    .incoming-message-name,
    .incoming-message-preview{
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }
    .incoming-message-name{
        font-size:14px;
        font-weight:700;
    }
    .incoming-message-preview{
        color:#b7b9c3;
        font-size:13px;
    }
    html[data-theme="light"] .incoming-message-preview{
        color:#586176;
    }
    html[data-theme="light"] .incoming-message-avatar{
        border-color:#536bd0;
        background:#283c9b;
        color:#fff;
    }
    @media (prefers-reduced-motion: reduce){
        .incoming-message-banner{
            transition:none;
        }
    }
    .notification-header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        padding:14px 16px;
        border-bottom:1px solid #2b2c33;
    }
    .notification-header h2{
        font-size:18px;
    }
    .notification-header button{
        padding:6px 8px;
        border:0;
        border-radius:7px;
        background:transparent;
        color:#a9bcff;
        font-size:12px;
        cursor:pointer;
    }
    .notification-header button:disabled{
        opacity:.5;
        cursor:default;
    }
    #notification-status{
        padding:16px;
        color:#b7b9c3;
        font-size:13px;
    }
    #notification-status[hidden]{
        display:none;
    }
    #notification-list{
        overflow-y:auto;
    }
    .notification-item{
        display:flex;
        align-items:flex-start;
        gap:11px;
        width:100%;
        padding:13px 16px;
        border:0;
        border-bottom:1px solid #25262b;
        background:transparent;
        color:inherit;
        text-align:left;
        cursor:pointer;
    }
    .notification-item:hover{
        background:#202127;
    }
    .notification-item.unread{
        background:#1b1e2b;
    }
    .notification-dot{
        width:8px;
        height:8px;
        flex:none;
        margin-top:6px;
        border-radius:50%;
        background:#728cff;
    }
    .notification-item:not(.unread) .notification-dot{
        visibility:hidden;
    }
    .app-install-dialog{
        width:min(420px, calc(100vw - 32px));
        margin:auto;
        padding:24px;
        border:1px solid #39405a;
        border-radius:18px;
        background:#111216;
        color:#f3f2e9;
        box-shadow:0 24px 80px rgba(0,0,0,.65);
    }
    .app-install-dialog::backdrop{
        background:rgba(0,0,0,.78);
        backdrop-filter:blur(3px);
    }
    .app-install-dialog h2{
        margin-bottom:10px;
        font-size:21px;
    }
    .app-install-copy,
    .app-install-help{
        color:#b7b9c3;
        font-size:14px;
        line-height:1.5;
    }
    .app-install-help:not([hidden]){
        margin-top:12px;
        padding:10px 12px;
        border-radius:10px;
        background:#1b1e2b;
    }
    .app-install-actions{
        display:flex;
        justify-content:flex-end;
        gap:10px;
        margin-top:22px;
    }
    .app-install-actions button{
        min-height:40px;
        padding:0 15px;
        border:1px solid #444755;
        border-radius:10px;
        background:#202127;
        color:#f3f2e9;
        font:inherit;
        cursor:pointer;
    }
    .app-install-actions .app-install-primary{
        border-color:#5268d2;
        background:#344fb8;
    }
    .app-install-actions button:focus-visible{
        outline:2px solid #9ab8ff;
        outline-offset:2px;
    }
    .app-install-actions button:disabled{
        cursor:wait;
        opacity:.6;
    }
    .notification-copy{
        display:flex;
        flex:1;
        flex-direction:column;
        gap:5px;
        min-width:0;
        overflow-wrap:anywhere;
        font-size:13px;
        line-height:1.4;
    }
    .notification-time{
        color:#9a9ca7;
        font-size:11px;
    }
    #circle1{
        position:relative;
        display:grid;
        place-items:center;
        overflow:hidden;
        margin-top:5px;
        border:1px solid black;
        border-radius: 50px;
        width:40px;
        height:40px;
        background-color:navy;
        transition: 1s;
    }
    #circle1:active{
        transform: scale(0.95);
    }
    #header222{
    color: white;
text-align: center;
font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-style: normal;
  margin-top: 3px;
}
    .lines{
        display:flex;
        flex-direction:row;
        align-items:center;
        justify-content:flex-start;
        gap:10px;
        border-bottom:1px solid gray;
        height:50px;
        padding-left:10px;
    }
    .profile-nav-avatar{
        display:none;
    }
    svg{
        height:24px;
        width:24px;
        color:white;
    }
    #box{
        position:fixed;
        top:51px;
        left:0;
        background-color: black;
        border:1px solid gray;
        height:calc(100vh - 51px);
        width:20%;
        box-sizing:border-box;
        display:flex;
        flex-direction:column;
    }
    #news-container{
        display:block;
        box-sizing:border-box;
        margin-left:20%;
        min-height:calc(100vh - 51px);
        padding:28px;
        color:white;
        overflow:hidden;
    }
    #news-view{
        min-width:0;
        overflow-x:clip;
    }
    #header1{
  display:flex;
  align-items:center;
  gap:9px;
  color:white;
  font-weight: 400;
  font-style: normal;
  font-family: "Changa One", sans-serif;
  font-weight: 400;
  padding-top:10px;
  padding-left: 10px;
    }
    #header1 img{
        display:block;
        width:28px;
        height:28px;
        object-fit:contain;
    }
    .menu-label{
        color:white;
  font-weight: 400;
  font-style: normal;
  font-family: "Changa One", sans-serif;
  font-weight: 400;
  font-size:20px;
    }
    #profile{
        display:flex;
        flex-direction:row;
        align-items:center;
        gap:10px;
        margin-top:auto;
        margin-left:10px;
        margin-bottom:24px;
    }
    #circle{
        border:1px solid navy;
        height:50px;
        width:50px;
        border-radius:50px;
        display:flex;
        justify-content:center;
        align-items:center;
        background-color:navy;
        flex-shrink:0;
        overflow:hidden;
    }
    #circle img,
    #circle1 img{
        display:block;
        width:100%;
        height:100%;
        object-fit:cover;
        border-radius:50%;
    }
    #circle1 img{
        position:absolute;
        inset:0;
    }
    #circle img[hidden],
    #circle1 img[hidden]{
        display:none;
    }
    #user_name{
        color:white;
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-style: normal;
        text-align: center;
        margin:0;
        font-size:30px;
    }
    #full_name{
        color:white;
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-style: normal;
        text-align: left;
        margin:0;
        font-size:16px;
        min-width:0;
        flex:1;
        overflow-wrap:anywhere;
    }
    .lines.active{
        background-color: navy;
    }
    .lines.active svg,
    .lines.active .menu-label{
        color:white;
    }
    #news-heading{
        margin-bottom:18px;
        color:#f3f2e9;
        font-family:"Changa One", sans-serif;
        font-size:26px;
        font-weight:400;
    }
    .image{
        display:block;
        width:100%;
        height:clamp(240px, 56vh, 620px);
        object-fit:cover;
        background-color:#090a08;
        border-radius:4px;
    }
    .image[hidden]{
        display:none;
    }
    .slide{
        box-sizing:border-box;
        flex:0 0 100%;
        min-width:0;
        width:100%;
        display:flex;
        flex-direction:column;
        gap:14px;
        padding:16px;
        border:1px solid #36382f;
        border-radius:8px;
        background-color:#151612;
    }
    .game_content,.game_description{
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-style: normal;
        text-align: left;
        color:white;
    }
    .game_content{
        font-size:22px;
    }
    .game_description{
        color:#b7b9ae;
        font-size:14px;
    }
    #slider-track{
        display:flex;
        flex-direction:row;
        min-width:0;
        width:100%;
        gap:0;
        transition:transform 0.5s ease;
        touch-action:pan-y;
    }
    #slider-track .slide{
        flex:0 0 100%;
        min-width:0;
        width:100%;
    }
    #slider-controls{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:14px;
        margin-top:16px;
    }
    .slider-arrow{
        display:grid;
        place-items:center;
        width:36px;
        height:36px;
        border:1px solid #45483c;
        border-radius:50%;
        background-color:#171914;
        color:#f3f2e9;
        cursor:pointer;
    }
    .slider-arrow:hover{
        border-color:white;
        color:white;
    }
    .slider-arrow svg{
        width:18px;
        height:18px;
    }
    #slider-indicators{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
    }
    .slider-indicator{
        width:8px;
        height:8px;
        padding:0;
        border:0;
        border-radius:8px;
        background-color:#686b60;
        cursor:pointer;
    }
    .slider-indicator[aria-current="true"]{
        width:22px;
        background-color:white;
    }
    #recent{
        font-family: "Archivo Black", sans-serif;

    <script>
        (() => {
            const splash = document.getElementById('app-splash');
            if (!splash) return;
            let dismissed = false;
            const dismissSplash = () => {
                if (dismissed) return;
                dismissed = true;
                splash.classList.add('is-hidden');
                splash.setAttribute('aria-hidden', 'true');
                window.setTimeout(() => splash.remove(), 450);
            };
            if (document.readyState === 'complete') {
                window.setTimeout(dismissSplash, 350);
            } else {
                window.addEventListener('load', () => {
                    window.setTimeout(dismissSplash, 350);
                }, { once: true });
            }
            window.setTimeout(dismissSplash, 6000);
        })();
    </script>
